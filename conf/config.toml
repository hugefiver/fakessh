[server]
# bind = ":22"
# version = "OpenSSH_8.8p1"
# max_try = 3
# delay = 0
# deviation = 0
# anti_scan = true
# success_ratio = 0.0
# success_seed = "anything"

# rate limit array
#[[server.rate_limit]]
#interval = 60
#limit = 10

#[[server.rate_limit]]
#interval = "1m"
#limit = 10

# Users with password can login
# `user` cannot duplicate or be empty
#[[server.users]]
#user = "root"
#password = "123456"

# How many unauthenticated connections can be connected at the same time
[server.max_conn]
# `max` < 0 means unlimited
# `max` = 0 or optional means default: 100
max = 0
# when connections exceed `hard_max`, new connection will be rejected
# `hard_max` <= 0 or `hard_max` <= `max`, will be max(default, 2 times of `max`), default: 65535
hard_max = 0
# `loss_ratio` in (0.0, 1.0]
# when `loss_ratio` <= 0.0, no probabilistic loss is applied before `hard_max`
# when `loss_ratio` > 1.0, it means 1.0
# if connections match `max`, it will literally increase to 1.0 when connectios meet `hard_max`
loss_ratio = 1.0

# Same as `max_conn`, but for successful connections
[server.max_succ_conn]
# default: 5
max = 0
# default: 10
hard_max = 0
loss_ratio = 1.0

[log]
# file = ""
# level = "info"
# format = "plain"
# log_passwd = false

[key]
# key = []
# type = "ed25519" # e.g. "ed25519,rsa:2048,ecdsa:256"

[modules.gitserver]
# enable = false

# user used serve git service
# default: git
#user = "git"

# if true, git-shell will run with current user
# default: false
#current_user = false

# user used to connect from ssh
# default same with field `user`
#ssh_user = "git"

# path of `git-shell` execute file
# empty means search in `PATH`
#git_shell = "/usr/bin/git-shell"

# path to store git repositories
# default: /home/git
#git_user_home = "/home/git"

# root directory under which local repositories live.
# default: same as `git_user_home`
#repo_root = "/home/git"

# path of `authorized_keys` file
# default: {git_user_home}/.ssh/authorized_keys
#authorized_keys = "/home/git/.ssh/authorized_keys"

# if true, authorized_keys will be auto updated
#watch_keys = false

# max_git_shell_processes = 0
# refuse_when_busy = false

# Repository backend. One of "local" or "ssh".
# "local": repositories are served from the local filesystem under `repo_root`.
# "ssh":   repositories are served by proxying to a remote git server over SSH.
# default: "local"
#backend = "local"

# Repository ACLs are TOML-only (cannot be set via -o options).
# Each repository has a `path` (relative to `repo_root`, forward-slash,
# no backslash or colon), an optional `backend_path` (defaults to `path`),
# and `read_keys` / `write_keys` lists of key fingerprints.
#
# Repository access is EXPLICIT ACL ONLY: a key is granted access only when its
# fingerprint matches an entry in the repository's ACL. No ACL match means DENY.
#   - `write_keys` grants BOTH write and read.
#   - `read_keys`  grants read only.
# A repository with no read_keys and no write_keys configured therefore grants
# access to NO key (deny for everyone), NOT read-only-for-everyone.
#
# When `enable = true` and no repositories are configured at all, all git
# access is denied (deny-all).
#
# IMPORTANT: put SSH key *fingerprints* (e.g. "SHA256:...") in read_keys /
# write_keys, NOT raw public key blobs.
#
#[[modules.gitserver.repositories]]
#path = "team/project.git"
#backend_path = "team/project.git"
#read_keys = ["SHA256:abc123..."]
#write_keys = ["SHA256:def456..."]
#
#[[modules.gitserver.repositories]]
#path = "team/ops.git"
#read_keys = ["SHA256:ghi789..."]

# SSH backend settings. Only consulted when `backend = "ssh"`.
# All of address / user / key_file / known_hosts are required when using the
# SSH backend. `timeout_seconds` defaults to 30 when <= 0.
#[modules.gitserver.ssh_backend]
#address = "git.example.com:22"
#user = "git"
#key_file = "/etc/fakessh/keys/git"
#known_hosts = "/etc/fakessh/known_hosts"
#timeout_seconds = 30

[modules.fakeshell]
enable = false

#rootfs = "/path/to/rootfs.tar"
# or
#rootfs = "/path/to/rootfs.zip"
# or
#rootfs = "/path/to/somewhere"

#[modules.fakeshell.env]
#user = "root"
#home = "/root"
#os = "FairyOS"
#kernel = "ctOS 3.1"
#hostname = "fakeshell"

#genenv = true
#envs = {"ENV1" = "VALUE1", "ENV2" = "VALUE2"}

#[modules.fakeshell.log]
#enable = false

# Session log directory. Each session writes one bounded JSON Lines file
# (one JSON object per line). If empty, defaults to "./sessions" relative
# to the server working directory. The directory is created with 0700
# permissions; session files are created with 0600.
#
# Bounded logging: command/error strings, per-event JSON, event counts and
# total session bytes are all capped. Once a cap is reached the logger
# writes one "truncated" marker and drops further events. Only parsed
# command names and bounded metadata are recorded; raw channel input is
# never logged.
#path = ""

# Compression codec. Only "" (no compression) or "gzip" are supported.
# Other values (e.g. "xz", "zstd") are rejected at config validation time
# when logging is enabled.
#compress = ""
